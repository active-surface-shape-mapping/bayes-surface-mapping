callbacks:
  - score_model_plot
n_iters: 600
global_seed: 42
init_data_strategy: SOBOL
cand_data_strategy: SOBOL
diagram_generator: FIND_PEAKS
base_kernel_kwargs:
  ard_num_dims: 2
init_n_points: 20
iter_n_candidates: 300
mean_module: QUADRATIC
base_kernel: MATERN52
acquisition_n_mc_samples: 500
acquisition_fantasy_quadrature: True
acquisition_fantasy_quadrature_points: 5
diagram_generator_kwargs:
  peak_height_rule: null
  max_n_peaks: 2
  peak_threshold: 0.035
acquisition_function: DISPERSION
addon_data_noise_std: 0.01
gp_noise_ceiling: null
gp_noise_floor: 1e-6 # 1e-4
init_dataset_paths:  [
        "data/111_Cv_run1.arrow",
        "data/111_Cv_run2.arrow",
        "data/111_Cv_run3.arrow",
    ]
sampling_dataset_paths: [
        "data/111_Cv_run1.arrow",
        "data/111_Cv_run2.arrow",
        "data/111_Cv_run3.arrow",
    ]
ground_truth_dataset_paths: [
        "data/111_Cv_run1.arrow",
        "data/111_Cv_run2.arrow",
        "data/111_Cv_run3.arrow",
    ]
gp_noise_prior: 
  name: LogNormalPrior
  kwargs:
    loc: -7.0
    scale: 1.5