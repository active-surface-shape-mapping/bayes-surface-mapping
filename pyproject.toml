[project]
name = "bayes-phase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "botorch>=0.14.0",
    "gpytorch>=1.14",
    "ipympl>=0.9.7",
    "jaxtyping>=0.3.2",
    "jupyterlab>=4.4.4",
    "linear-operator>=0.6",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "omegaconf>=2.3.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "pytest>=8.4.1",
    "scikit-image>=0.25.2",
    "scipy>=1.16.0",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "icecream>=2.1.5",
    "pre-commit>=4.3.0",
    "ruff>=0.12.3",
]

[tool.setuptools]
packages = ["bayes_phase"]

[tool.ruff.lint]
# Skip linting error from jaxtyping
extend-ignore = ["F722"]
