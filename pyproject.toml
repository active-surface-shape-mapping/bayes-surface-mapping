[project]
name = "bayes-phase"
version = "0.1.0"
description = "dependencies for bayes-phase"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "botorch>=0.14.0",
    "gpytorch>=1.14",
    "ipympl>=0.9.7",
    "jaxtyping>=0.3.2",
    "jupyterlab>=4.4.4",
    "linear-operator>=0.6",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "omegaconf>=2.3.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "pytest>=8.4.1",
    "scikit-image>=0.25.2",
    "scipy>=1.16.0",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "plotly>=6.5.0",
    "kaleido>=1.1.0",
    "shapely>=2.1.2",
    "geopandas>=1.1.3",
    "jsonlines>=4.0.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
]

[dependency-groups]
dev = [
    "icecream>=2.1.5",
    "pre-commit>=4.3.0",
    "ruff>=0.12.3",
]

[tool.setuptools]
packages = ["bayes_phase"]

[tool.ruff.lint]
extend-select = [
    "B", # Likely bugs
    "RUF", # Ruff-specific, like iterable unpacking
]
# Skip a few linting errors
extend-ignore = [
    "F722",  # Jaxtyping annotations
    "B028",  # warnings.warn stacklevel
    "B905",  # zip(strict=...)
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

# Keep some interface/type errors visible.
reportMissingTypeArgument = "error"
reportMissingParameterType = "warning"

# Reduce noise from partially typed scientific libraries and gradual typing.
reportExplicitAny = false
reportAny = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

# A couple more unnecessary warnings
reportMissingTypeStubs = false
reportImplicitStringConcatenation = false
